<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151C;
    --panel-2:#181C24;
    --line:#242A34;
    --amber:#FFB100;
    --red:#FF4B4B;
    --text:#F2F3F5;
    --muted:#8A93A3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:none;
  }
  h1,h2{ font-family:'Oswald', system-ui, sans-serif; margin:0; }

  header{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(10,12,16,0));
    padding:18px 16px 6px;
  }
  .title{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .title h1{
    font-size:22px; letter-spacing:0.5px; font-weight:600;
    display:flex; align-items:center; gap:9px;
  }
  .title h1 .bulb{
    width:10px;height:10px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  .refresh-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    font-family:inherit; font-size:12px; padding:7px 10px; border-radius:8px;
  }
  .refresh-btn:active{ background:var(--panel-2); }

  .chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:12px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:8px 14px; border-radius:20px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--muted); font-size:13px; font-family:'Oswald',sans-serif;
    letter-spacing:0.3px; white-space:nowrap;
  }
  .chip.active{
    background:var(--amber); border-color:var(--amber); color:#141414; font-weight:600;
  }

  .day-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 2px 14px;
  }
  .day-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:38px; height:38px; border-radius:10px; font-size:16px;
  }
  .day-label{
    font-family:'Oswald',sans-serif; font-size:14px; color:var(--muted);
    letter-spacing:0.4px; text-transform:uppercase;
  }
  .day-label b{ color:var(--text); }

  main{ padding:0 16px 40px; }

  .status-msg{
    color:var(--muted); font-size:13px; text-align:center; padding:60px 20px;
    line-height:1.6;
  }
  .status-msg a{ color:var(--amber); text-decoration:none; border-bottom:1px dotted var(--amber); }

  .game-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:10px;
  }
  .league-tag{
    font-size:10px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1px; margin-bottom:8px; font-family:'Oswald',sans-serif;
  }
  .matchup{
    display:flex; align-items:center; gap:12px;
  }
  .teams{ flex:1; min-width:0; }
  .team-row{
    display:flex; align-items:center; gap:8px; padding:3px 0;
  }
  .team-row img{ width:22px; height:22px; object-fit:contain; flex:0 0 auto; }
  .team-name{
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .team-record{ font-size:11px; color:var(--muted); margin-left:4px; }
  .team-score{
    margin-left:auto; font-size:16px; font-weight:600; padding-left:8px;
  }
  .winner .team-name, .winner .team-score{ color:var(--text); }
  .loser .team-name, .loser .team-score{ color:var(--muted); }

  .meta-col{
    flex:0 0 auto; text-align:right; min-width:72px;
  }
  .status-pill{
    font-size:11px; padding:3px 8px; border-radius:6px; display:inline-block;
    font-family:'Oswald',sans-serif; letter-spacing:0.3px;
  }
  .status-pill.live{ background:rgba(255,75,75,0.15); color:var(--red); }
  .status-pill.final{ background:var(--panel-2); color:var(--muted); }
  .status-pill.sched{ background:rgba(255,177,0,0.12); color:var(--amber); }
  .time-label{ font-size:13px; margin-top:6px; color:var(--text); }
  .network{ font-size:10px; color:var(--muted); margin-top:4px; }

  .footer-note{
    text-align:center; color:var(--line); font-size:11px; padding:20px 20px 4px;
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1><span class="bulb"></span>Scoreboard</h1>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="day-row">
    <button class="day-btn" id="prevDay">&#8249;</button>
    <div class="day-label" id="dayLabel">Today</div>
    <button class="day-btn" id="nextDay">&#8250;</button>
  </div>
</header>

<main id="main">
  <div class="status-msg">Loading games&hellip;</div>
</main>

<div class="footer-note">Data via ESPN &middot; tap Refresh anytime</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
(function(){
  // ---- League configuration: sport slug + league slug used by ESPN's public scoreboard API ----
  var LEAGUES = [
    { id:'fiba',   label:'FIBA',   sport:'basketball', league:'fiba',                 webPath:'fiba' },
    { id:'wnba',   label:'WNBA',   sport:'basketball', league:'wnba',                 webPath:'wnba' },
    { id:'nba',    label:'NBA',    sport:'basketball', league:'nba',                  webPath:'nba' },
    { id:'nfl',    label:'NFL',    sport:'football',   league:'nfl',                  webPath:'nfl' },
    { id:'mlb',    label:'MLB',    sport:'baseball',   league:'mlb',                  webPath:'mlb' },
    { id:'nhl',    label:'NHL',    sport:'hockey',      league:'nhl',                 webPath:'nhl' },
    { id:'ncaaw',  label:'NCAA W', sport:'basketball', league:'womens-college-basketball', webPath:'womens-college-basketball' },
    { id:'ncaam',  label:'NCAA M', sport:'basketball', league:'mens-college-basketball',   webPath:'mens-college-basketball' }
  ];

  var state = {
    leagueId: localStorage.getItem('sb_league') || 'fiba',
    dayOffset: 0
  };

  var chipsEl = document.getElementById('chips');
  var mainEl = document.getElementById('main');
  var dayLabelEl = document.getElementById('dayLabel');

  function currentLeague(){
    for (var i=0;i<LEAGUES.length;i++){ if (LEAGUES[i].id === state.leagueId) return LEAGUES[i]; }
    return LEAGUES[0];
  }

  function renderChips(){
    chipsEl.innerHTML = '';
    LEAGUES.forEach(function(l){
      var b = document.createElement('button');
      b.className = 'chip' + (l.id === state.leagueId ? ' active' : '');
      b.textContent = l.label;
      b.onclick = function(){
        state.leagueId = l.id;
        localStorage.setItem('sb_league', l.id);
        renderChips();
        load();
      };
      chipsEl.appendChild(b);
    });
  }

  function dateForOffset(offset){
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return d;
  }

  function yyyymmdd(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return '' + y + m + day;
  }

  function renderDayLabel(){
    var d = dateForOffset(state.dayOffset);
    var opts = { weekday:'short', month:'short', day:'numeric' };
    var txt = d.toLocaleDateString(undefined, opts);
    if (state.dayOffset === 0) txt = 'Today &middot; ' + txt;
    else if (state.dayOffset === 1) txt = 'Tomorrow &middot; ' + txt;
    else if (state.dayOffset === -1) txt = 'Yesterday &middot; ' + txt;
    dayLabelEl.innerHTML = txt;
  }

  function statusInfo(comp){
    var st = comp.status && comp.status.type ? comp.status.type : {};
    if (st.state === 'in') return { cls:'live', label: (comp.status.type.shortDetail || 'LIVE') };
    if (st.state === 'post') return { cls:'final', label: st.description || 'Final' };
    // pre
    var d = new Date(comp.date);
    var timeLabel = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    return { cls:'sched', label:'Scheduled', time:timeLabel };
  }

  function buildCard(event){
    var comp = event.competitions[0];
    var competitors = comp.competitors.slice().sort(function(a,b){
      return (a.homeAway === 'home' ? 1 : 0) - (b.homeAway === 'home' ? 1 : 0);
    });
    var st = statusInfo(comp);

    var card = document.createElement('div');
    card.className = 'game-card';

    var tag = document.createElement('div');
    tag.className = 'league-tag';
    tag.textContent = event.shortName ? (comp.notes && comp.notes[0] ? comp.notes[0].headline : currentLeague().label) : currentLeague().label;
    card.appendChild(tag);

    var matchup = document.createElement('div');
    matchup.className = 'matchup';

    var teamsWrap = document.createElement('div');
    teamsWrap.className = 'teams';

    var winnerId = null;
    competitors.forEach(function(c){ if (c.winner) winnerId = c.id; });

    competitors.forEach(function(c){
      var row = document.createElement('div');
      row.className = 'team-row' + (winnerId ? (c.id === winnerId ? ' winner' : ' loser') : '');
      var logo = document.createElement('img');
      logo.src = (c.team && c.team.logo) ? c.team.logo : '';
      logo.onerror = function(){ this.style.visibility = 'hidden'; };
      row.appendChild(logo);
      var name = document.createElement('span');
      name.className = 'team-name';
      name.textContent = (c.team && (c.team.shortDisplayName || c.team.displayName)) || 'TBD';
      row.appendChild(name);
      if (c.records && c.records[0]) {
        var rec = document.createElement('span');
        rec.className = 'team-record';
        rec.textContent = c.records[0].summary;
        row.appendChild(rec);
      }
      var score = document.createElement('span');
      score.className = 'team-score';
      score.textContent = (c.score !== undefined && st.cls !== 'sched') ? c.score : '';
      row.appendChild(score);
      teamsWrap.appendChild(row);
    });

    matchup.appendChild(teamsWrap);

    var metaCol = document.createElement('div');
    metaCol.className = 'meta-col';
    var pill = document.createElement('div');
    pill.className = 'status-pill ' + st.cls;
    pill.textContent = st.cls === 'sched' ? 'Sched' : st.label;
    metaCol.appendChild(pill);
    if (st.cls === 'sched') {
      var timeLabel = document.createElement('div');
      timeLabel.className = 'time-label';
      timeLabel.textContent = st.time;
      metaCol.appendChild(timeLabel);
    } else if (st.cls === 'live') {
      var liveLabel = document.createElement('div');
      liveLabel.className = 'time-label';
      liveLabel.textContent = st.label;
      metaCol.appendChild(liveLabel);
    }
    var broadcast = (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names) ? comp.broadcasts[0].names.join('/') : '';
    if (broadcast) {
      var net = document.createElement('div');
      net.className = 'network';
      net.textContent = broadcast;
      metaCol.appendChild(net);
    }
    matchup.appendChild(metaCol);

    card.appendChild(matchup);
    return card;
  }

  function espnWebLink(){
    var l = currentLeague();
    return 'https://www.espn.com/' + l.webPath + '/scoreboard';
  }

  function showMessage(text){
    mainEl.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'status-msg';
    div.innerHTML = text + '<br><br><a href="' + espnWebLink() + '" target="_blank">Open full schedule on ESPN</a>';
    mainEl.appendChild(div);
  }

  function load(){
    renderDayLabel();
    mainEl.innerHTML = '<div class="status-msg">Loading games&hellip;</div>';
    var l = currentLeague();
    var date = yyyymmdd(dateForOffset(state.dayOffset));
    var url = 'https://site.api.espn.com/apis/site/v2/sports/' + l.sport + '/' + l.league + '/scoreboard?dates=' + date;

    function tryFetch(target){
      return fetch(target).then(function(res){
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        return res.json();
      });
    }

    // Try a direct request first; if the browser blocks it (CORS) or it
    // otherwise fails, retry through a public CORS-friendly relay.
    tryFetch(url).catch(function(){
      var relay = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
      return tryFetch(relay);
    }).then(function(data){
      var events = data.events || [];
      if (events.length === 0) {
        showMessage('No ' + l.label + ' games on this date.');
        return;
      }
      mainEl.innerHTML = '';
      events.forEach(function(ev){
        mainEl.appendChild(buildCard(ev));
      });
    }).catch(function(err){
      showMessage('Couldn\'t load ' + l.label + ' data right now.');
    });
  }

  document.getElementById('prevDay').onclick = function(){ state.dayOffset -= 1; load(); };
  document.getElementById('nextDay').onclick = function(){ state.dayOffset += 1; load(); };
  document.getElementById('refreshBtn').onclick = function(){ load(); };

  renderChips();
  load();
})();
</script>

</body>
</html>
